version: "3.9"

services:
  frontend:
    container_name: frontend
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "80:80"
      - "443:443"
    restart: unless-stopped
    env_file:
      - .env
    networks:
      - tsts-network
    volumes:
      - /opt/tsts-project/certs:/etc/nginx/certs:ro

networks:
  tsts-network:
    external: true
